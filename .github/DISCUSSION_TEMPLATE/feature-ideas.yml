body:
  - type: markdown
    attributes:
      value: |
        Search first: a 👍 on an existing idea counts for more than a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the moment it would help, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Rin Chat to do?
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: Seen it somewhere else?
      description: Another app that does it well, SillyTavern included, with links or screenshots.
