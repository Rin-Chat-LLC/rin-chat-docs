body:
  - type: markdown
    attributes:
      value: |
        Search first, and check the [troubleshooting guide](https://rin.chat/guide/troubleshooting/). When an answer solves it, mark it as the answer so the next person finds it. Never post an API key, password or recovery kit.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do, and what happens instead?
      description: Copy any error message word for word.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rin Chat version
      description: Settings → Updates, in the "This version" card.
      placeholder: "1.0.4"
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux (AppImage)
        - Linux (.deb)
        - Android
        - Phone browser (remote)
        - Other
  - type: input
    id: provider
    attributes:
      label: AI provider and model, if it is about replies
      placeholder: "OpenRouter, deepseek/deepseek-v3.2 / LM Studio, a local Mistral"
