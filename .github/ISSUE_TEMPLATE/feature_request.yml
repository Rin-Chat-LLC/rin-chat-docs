name: Feature request
description: Suggest something Rin Chat should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search the existing issues first. A thumbs-up on a matching request counts.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the moment it would help, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Rin Chat to do?
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: Seen it somewhere else?
      description: Another app that does it well, SillyTavern included, and links or screenshots.
